  # ----------------------------------------------------------
  # 21. IDENTITAS & KONTAK WEBSITE
  # ----------------------------------------------------------
  - name: "settings"
    label: "⚙️ Pengaturan Website"
    files:
      - name: "identitas"
        label: "Identitas & Kontak"
        file: "content/pages/identitas.json"
        fields:
          - { label: "Nama Website", name: "nama", widget: "string", default: "Kasepuhan Adat Citorek" }
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Favicon", name: "favicon", widget: "image" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Menjaga Adat, Merawat Alam, Mewariskan Budaya" }
          - { label: "Deskripsi Resmi", name: "deskripsi", widget: "text" }
          - { label: "Alamat", name: "alamat", widget: "text" }
          - { label: "Telepon", name: "telepon", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "WhatsApp", name: "whatsapp", widget: "string" }
          - { label: "Google Maps Embed URL", name: "maps_embed", widget: "string", required: false }
          - { label: "Jam Layanan", name: "jam_layanan", widget: "string" }

      - name: "sosmed"
        label: "Media Sosial"
        file: "content/pages/sosmed.json"
        fields:
          - label: "Daftar Media Sosial"
            name: "items"
            widget: "list"
            fields:
              - label: "Platform"
                name: "platform"
                widget: "select"
                options: ["YouTube", "Instagram", "Facebook", "WhatsApp", "Twitter/X", "TikTok", "Website Lain"]
              - { label: "URL", name: "url", widget: "string" }

      - name: "tampilan"
        label: "Pengaturan Tampilan"
        file: "content/pages/tampilan.json"
        fields:
          - { label: "Warna Utama", name: "warna_utama", widget: "color", default: "#2d5016" }
          - { label: "Warna Sekunder", name: "warna_sekunder", widget: "color", default: "#c9a961" }
          - { label: "Warna Latar", name: "warna_latar", widget: "color", default: "#ffffff" }
          - { label: "Footer Text", name: "footer_text", widget: "text", default: "Website resmi Kasepuhan Adat Citorek." }
          - label: "Section Beranda (urutan & visibilitas)"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Nama Section", name: "nama", widget: "string" }
              - { label: "Aktif", name: "aktif", widget: "boolean", default: true }
              - { label: "Urutan", name: "urutan", widget: "number", default: 1 }