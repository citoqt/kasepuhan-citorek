# ============================================================
# ADMIN PANEL — KASEPUHAN ADAT CITOREK
# Konfigurasi Lengkap — Semua Konten Dapat Diedit
# ============================================================

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Tambah {{collection}} "{{slug}}" oleh {{author}}'
    update: 'Update {{collection}} "{{slug}}" oleh {{author}}'
    delete: 'Hapus {{collection}} "{{slug}}" oleh {{author}}'
    uploadMedia: 'Upload media "{{path}}" oleh {{author}}'
    deleteMedia: 'Hapus media "{{path}}" oleh {{author}}'

locale: 'id'
publish_mode: simple

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://kasepuhan-citorek.netlify.app
display_url: https://kasepuhan-citorek.netlify.app
logo_url: /images/logo.png

# ============================================================
# KOLEKSI
# ============================================================
collections:

  # ==========================================================
  # KATEGORI 1: PENGATURAN UTAMA (PALING ATAS)
  # ==========================================================
  - name: "pengaturan_utama"
    label: "⚙️ PENGATURAN UTAMA"
    label_singular: "Pengaturan"
    files:

      # --- LOGO & FAVICON ---
      - name: "logo"
        label: "🎨 Logo, Favicon & Branding"
        file: "content/pages/logo.json"
        fields:
          - { label: "Logo Utama (Header, Hero, Footer)", name: "logo_utama", widget: "image", required: false }
          - { label: "Favicon (Ikon Tab Browser)", name: "favicon", widget: "image", required: false }
          - { label: "Logo Versi Terang (untuk background gelap)", name: "logo_light", widget: "image", required: false }
          - { label: "Logo Versi Gelap (untuk background terang)", name: "logo_dark", widget: "image", required: false }
          - { label: "Teks Branding Baris 1", name: "nama_baris1", widget: "string", default: "KASEPUHAN ADAT" }
          - { label: "Teks Branding Baris 2", name: "nama_baris2", widget: "string", default: "CITOREK" }
          - { label: "Warna Teks Baris 1", name: "warna_baris1", widget: "color", default: "#ffffff" }
          - { label: "Warna Teks Baris 2", name: "warna_baris2", widget: "color", default: "#c9a961" }
          - { label: "Ukuran Logo Header (px)", name: "ukuran_header", widget: "number", default: 48 }
          - { label: "Ukuran Logo Hero (px)", name: "ukuran_hero", widget: "number", default: 110 }
          - { label: "Ukuran Logo Footer (px)", name: "ukuran_footer", widget: "number", default: 48 }

      # --- IDENTITAS ---
      - name: "identitas"
        label: "🏛️ Identitas Website"
        file: "content/pages/identitas.json"
        fields:
          - { label: "Nama Lengkap Website", name: "nama", widget: "string", default: "Kasepuhan Adat Citorek" }
          - { label: "Nama Singkat", name: "nama_singkat", widget: "string", default: "Kasepuhan Citorek" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Menjaga Adat, Merawat Alam, Mewariskan Budaya" }
          - { label: "Deskripsi Resmi", name: "deskripsi", widget: "text" }
          - { label: "Alamat Lengkap", name: "alamat", widget: "text" }
          - { label: "Telepon", name: "telepon", widget: "string", required: false }
          - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }
          - { label: "Email Resmi", name: "email", widget: "string", required: false }
          - { label: "Jam Layanan", name: "jam_layanan", widget: "string", required: false }

      # --- KONTAK ---
      - name: "kontak"
        label: "📞 Kontak & Lokasi"
        file: "content/pages/kontak.json"
        fields:
          - { label: "Google Maps Embed URL", name: "maps_embed", widget: "string", required: false, hint: "URL iframe dari Google Maps" }
          - { label: "Latitude", name: "lat", widget: "string", required: false }
          - { label: "Longitude", name: "lng", widget: "string", required: false }
          - label: "Kontak Tambahan"
            name: "kontak_tambahan"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Nilai", name: "nilai", widget: "string" }

      # --- MEDIA SOSIAL ---
      - name: "sosmed"
        label: "📱 Media Sosial"
        file: "content/pages/sosmed.json"
        fields:
          - label: "Daftar Media Sosial"
            name: "items"
            widget: "list"
            fields:
              - label: "Platform"
                name: "platform"
                widget: "select"
                options: ["YouTube", "Instagram", "Facebook", "WhatsApp", "Twitter/X", "TikTok", "Website Lain"]
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Aktif", name: "aktif", widget: "boolean", default: true }

      # --- MENU NAVIGASI ---
      - name: "menu"
        label: "🧭 Menu Navigasi Header"
        file: "content/pages/menu.json"
        fields:
          - label: "Item Menu"
            name: "items"
            widget: "list"
            summary: '{{fields.label}} → {{fields.url}}'
            fields:
              - { label: "Label Menu", name: "label", widget: "string" }
              - { label: "URL / Link", name: "url", widget: "string" }
              - { label: "Urutan", name: "urutan", widget: "number", default: 1 }
              - { label: "Tampilkan", name: "aktif", widget: "boolean", default: true }
              - label: "Submenu"
                name: "submenu"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

      # --- FOOTER ---
      - name: "footer"
        label: "🦶 Footer Website"
        file: "content/pages/footer.json"
        fields:
          - { label: "Deskripsi Footer", name: "deskripsi", widget: "text" }
          - { label: "Teks Copyright", name: "copyright", widget: "string", default: "Seluruh hak dilindungi." }
          - label: "Kolom Footer"
            name: "kolom"
            widget: "list"
            fields:
              - { label: "Judul Kolom", name: "judul", widget: "string" }
              - label: "Link di Kolom"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

      # --- TAMPILAN & TEMA ---
      - name: "tampilan"
        label: "🎨 Warna, Font & Tema"
        file: "content/pages/tampilan.json"
        fields:
          - label: "Warna Utama (Hijau Tua)"
            name: "warna_utama"
            widget: "color"
            default: "#1f3d1f"
          - label: "Warna Sekunder (Hijau)"
            name: "warna_sekunder"
            widget: "color"
            default: "#2d5016"
          - label: "Warna Aksen (Emas)"
            name: "warna_aksen"
            widget: "color"
            default: "#c9a961"
          - label: "Warna Latar Belakang"
            name: "warna_latar"
            widget: "color"
            default: "#ffffff"
          - label: "Warna Background Soft"
            name: "warna_soft"
            widget: "color"
            default: "#faf8f4"
          - label: "Warna Teks Utama"
            name: "warna_teks"
            widget: "color"
            default: "#2b2b2b"
          - label: "Font Utama"
            name: "font_utama"
            widget: "select"
            options: ["Inter", "Poppins", "Roboto", "Open Sans", "Nunito"]
            default: "Inter"
          - label: "Font Judul"
            name: "font_judul"
            widget: "select"
            options: ["Playfair Display", "Merriweather", "Lora", "Cormorant Garamond"]
            default: "Playfair Display"

      # --- SEO GLOBAL ---
      - name: "seo_global"
        label: "🔍 SEO Global"
        file: "content/pages/seo.json"
        fields:
          - { label: "Meta Title Default", name: "meta_title", widget: "string", default: "Kasepuhan Adat Citorek" }
          - { label: "Meta Description Default", name: "meta_description", widget: "text" }
          - { label: "Keywords", name: "keywords", widget: "string" }
          - { label: "Open Graph Image", name: "og_image", widget: "image", required: false }
          - { label: "Google Analytics ID", name: "ga_id", widget: "string", required: false, hint: "Contoh: G-XXXXXXXXXX" }

  # ==========================================================
  # KATEGORI 2: BERANDA
  # ==========================================================
  - name: "beranda"
    label: "🏠 BERANDA"
    label_singular: "Section Beranda"
    files:

      # --- HERO ---
      - name: "hero"
        label: "🎬 Hero Section"
        file: "content/beranda/hero.json"
        fields:
          - { label: "Aktifkan Section", name: "aktif", widget: "boolean", default: true }
          - { label: "Urutan", name: "urutan", widget: "number", default: 1 }
          - { label: "Gambar Background", name: "gambar_bg", widget: "image" }
          - { label: "URL Video Background (opsional)", name: "video_bg", widget: "string", required: false, hint: "Kosongkan jika pakai gambar" }
          - { label: "Judul Hero", name: "judul", widget: "string", default: "KASEPUHAN ADAT CITOREK" }
          - { label: "Subjudul / Tagline", name: "subjudul", widget: "string", default: "Menjaga Adat, Merawat Alam, Mewariskan Budaya" }
          - { label: "Tombol 1 — Teks", name: "btn1_text", widget: "string", default: "Jelajahi Kasepuhan" }
          - { label: "Tombol 1 — Link", name: "btn1_link", widget: "string", default: "#tentang" }
          - { label: "Tombol 2 — Teks", name: "btn2_text", widget: "string", default: "Tentang Kami" }
          - { label: "Tombol 2 — Link", name: "btn2_link", widget: "string", default: "profil.html" }
          - { label: "Opacity Overlay (0-1)", name: "overlay", widget: "number", default: 0.6, value_type: "float", min: 0, max: 1, step: 0.1 }

      # --- SAMBUTAN ---
      - name: "sambutan"
        label: "🗣️ Sambutan Abah/Ketua Adat"
        file: "content/beranda/sambutan.json"
        fields:
          - { label: "Aktifkan Section", name: "aktif", widget: "boolean", default: true }
          - { label: "Urutan", name: "urutan", widget: "number", default: 2 }
          - { label: "Foto Abah", name: "foto", widget: "image" }
          - { label: "Nama", name: "nama", widget: "string" }
          - { label: "Jabatan", name: "jabatan", widget: "string" }
          - { label: "Sambutan", name: "sambutan", widget: "text" }
          - { label: "Link Selengkapnya", name: "link", widget: "string", default: "profil.html" }

      # --- TENTANG ---
      - name: "tentang"
        label: "📖 Sekilas Tentang"
        file: "content/beranda/tentang.json"
        fields:
          - { label: "Aktifkan Section", name: "aktif", widget: "boolean", default: true }
          - { label: "Urutan", name: "urutan", widget: "number", default: 3 }
          - { label: "Judul Section", name: "judul", widget: "string", default: "Tentang Kasepuhan" }
          - { label: "Isi", name: "isi", widget: "markdown" }

      # --- STATISTIK ---
      - name: "statistik"
        label: "📊 Statistik"
        file: "content/beranda/statistik.json"
        fields:
          - { label: "Aktifkan Section", name: "aktif", widget: "boolean", default: true }
          - { label: "Urutan", name: "urutan", widget: "number", default: 4 }
          - label: "Item Statistik"
            name: "items"
            widget: "list"
            summary: '{{fields.nilai}} - {{fields.label}}'
            fields:
              - { label: "Nilai/Angka", name: "nilai", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Ikon (emoji)", name: "ikon", widget: "string", required: false }

      # --- FILOSOFI ---
      - name: "filosofi_home"
        label: "💭 Filosofi Beranda"
        file: "content/beranda/filosofi.json"
        fields:
          - { label: "Aktifkan Section", name: "aktif", widget: "boolean", default: true }
          - { label: "Urutan", name: "urutan", widget: "number", default: 7 }
          - { label: "Kutipan Filosofi", name: "kutipan", widget: "text" }
          - { label: "Sumber", name: "sumber", widget: "string" }
          - { label: "Background Image (opsional)", name: "bg", widget: "image", required: false }

      # --- GALERI BERANDA ---
      - name: "galeri_home"
        label: "🖼️ Galeri Beranda (Preview)"
        file: "content/beranda/galeri.json"
        fields:
          - { label: "Aktifkan Section", name: "aktif", widget: "boolean", default: true }
          - { label: "Urutan", name: "urutan", widget: "number", default: 8 }
          - { label: "Judul Section", name: "judul", widget: "string", default: "Dokumentasi" }
          - { label: "Jumlah Foto Tampil", name: "limit", widget: "number", default: 5 }
          - label: "Foto Pilihan"
            name: "foto"
            widget: "list"
            fields:
              - { label: "Gambar", name: "gambar", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }

      # --- CTA ---
      - name: "cta"
        label: "📣 Call To Action"
        file: "content/beranda/cta.json"
        fields:
          - { label: "Aktifkan Section", name: "aktif", widget: "boolean", default: true }
          - { label: "Urutan", name: "urutan", widget: "number", default: 9 }
          - { label: "Judul CTA", name: "judul", widget: "string" }
          - { label: "Deskripsi", name: "deskripsi", widget: "text" }
          - { label: "Tombol 1 — Teks", name: "btn1_text", widget: "string" }
          - { label: "Tombol 1 — Link", name: "btn1_link", widget: "string" }
          - { label: "Tombol 2 — Teks", name: "btn2_text", widget: "string" }
          - { label: "Tombol 2 — Link", name: "btn2_link", widget: "string" }

      # --- SECTION ORDER ---
      - name: "section_order"
        label: "🔀 Urutan & Visibilitas Section Beranda"
        file: "content/beranda/sections.json"
        fields:
          - label: "Urutan Section (atur tampil/nonaktif)"
            name: "sections"
            widget: "list"
            summary: '{{fields.nama}} — {{fields.aktif}}'
            fields:
              - { label: "Nama Section", name: "nama", widget: "string" }
              - { label: "Aktif", name: "aktif", widget: "boolean", default: true }
              - { label: "Urutan", name: "urutan", widget: "number" }

  # ==========================================================
  # KATEGORI 3: PROFIL
  # ==========================================================
  - name: "profil"
    label: "🏛️ PROFIL KASEPUHAN"
    label_singular: "Profil"
    files:
      - name: "sejarah"
        label: "📜 Sejarah & Asal-Usul"
        file: "content/profil/sejarah.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Sejarah & Asal-Usul" }
          - { label: "Featured Image", name: "gambar", widget: "image", required: false }
          - { label: "Sejarah Berdirinya Kasepuhan", name: "body", widget: "markdown" }
          - label: "Timeline Sejarah"
            name: "timeline"
            widget: "list"
            required: false
            fields:
              - { label: "Tahun/Periode", name: "tahun", widget: "string" }
              - { label: "Judul Peristiwa", name: "judul", widget: "string" }
              - { label: "Deskripsi", name: "deskripsi", widget: "text" }
              - { label: "Gambar", name: "gambar", widget: "image", required: false }
          - label: "Silsilah Leluhur"
            name: "silsilah"
            widget: "list"
            required: false
            fields:
              - { label: "Nama", name: "nama", widget: "string" }
              - { label: "Periode", name: "periode", widget: "string" }
              - { label: "Keterangan", name: "keterangan", widget: "text", required: false }
              - { label: "Foto", name: "foto", widget: "image", required: false }

      - name: "filosofi"
        label: "🌿 Filosofi & Nilai Adat"
        file: "content/profil/filosofi.json"
        fields:
          - { label: "Judul Halaman", name: "judul", widget: "string", default: "Filosofi & Nilai Adat" }
          - { label: "Kutipan Utama", name: "kutipan", widget: "text" }
          - { label: "Sumber Kutipan", name: "sumber", widget: "string" }
          - { label: "Penjelasan Lengkap", name: "body", widget: "markdown" }
          - label: "Nilai-Nilai Adat"
            name: "nilai"
            widget: "list"
            fields:
              - { label: "Nama Nilai", name: "nama", widget: "string" }
              - { label: "Deskripsi", name: "deskripsi", widget: "text" }
              - { label: "Ikon (emoji)", name: "ikon", widget: "string", required: false }

      - name: "wilayah"
        label: "🗺️ Wilayah & Geografi"
        file: "content/profil/wilayah.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Wilayah & Geografi" }
          - { label: "Deskripsi", name: "body", widget: "markdown" }
          - { label: "Peta Embed URL", name: "peta_embed", widget: "string", required: false }
          - label: "Batas Wilayah"
            name: "batas"
            widget: "object"
            required: false
            fields:
              - { label: "Utara", name: "utara", widget: "string" }
              - { label: "Selatan", name: "selatan", widget: "string" }
              - { label: "Timur", name: "timur", widget: "string" }
              - { label: "Barat", name: "barat", widget: "string" }
          - label: "Kampung-Kampung"
            name: "kampung"
            widget: "list"
            required: false
            fields:
              - { label: "Nama Kampung", name: "nama", widget: "string" }
              - { label: "Deskripsi", name: "deskripsi", widget: "text" }
              - { label: "Foto", name: "foto", widget: "image", required: false }

  # ==========================================================
  # KATEGORI 4: STRUKTUR KEPEMIMPINAN
  # ==========================================================
  - name: "struktur"
    label: "👥 STRUKTUR KEPEMIMPINAN"
    label_singular: "Pejabat Adat"
    folder: "content/struktur"
    create: true
    slug: "{{slug}}"
    identifier_field: "nama"
    summary: '{{nama}} — {{jabatan}}'
    fields:
      - { label: "Nama Lengkap", name: "nama", widget: "string" }
      - { label: "Jabatan", name: "jabatan", widget: "string", hint: "Contoh: Abah, Olot, Jaro" }
      - { label: "Foto Resmi", name: "foto", widget: "image" }
      - { label: "Biografi", name: "biografi", widget: "markdown" }
      - { label: "Periode Jabatan", name: "periode", widget: "string", required: false }
      - { label: "Kontak (opsional)", name: "kontak", widget: "string", required: false }
      - { label: "Urutan Tampil", name: "urutan", widget: "number", default: 99 }
      - { label: "Aktif", name: "aktif", widget: "boolean", default: true }

  # ==========================================================
  # KATEGORI 5: BUDAYA & TRADISI
  # ==========================================================
  - name: "budaya"
    label: "🎭 BUDAYA & TRADISI"
    label_singular: "Budaya"
    files:
      - name: "upacara_index"
        label: "🎊 Pengantar Upacara Adat"
        file: "content/budaya/upacara-index.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Upacara Adat" }
          - { label: "Pengantar", name: "body", widget: "markdown" }
      - name: "kesenian_index"
        label: "🎵 Pengantar Kesenian & Musik"
        file: "content/budaya/kesenian-index.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Kesenian & Musik" }
          - { label: "Pengantar", name: "body", widget: "markdown" }
      - name: "arsitektur_index"
        label: "🏠 Pengantar Arsitektur"
        file: "content/budaya/arsitektur-index.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Arsitektur & Rumah Adat" }
          - { label: "Pengantar", name: "body", widget: "markdown" }
      - name: "pakaian_index"
        label: "👘 Pengantar Pakaian Adat"
        file: "content/budaya/pakaian-index.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Pakaian & Atribut Adat" }
          - { label: "Pengantar", name: "body", widget: "markdown" }

  - name: "upacara"
    label: "🎊 Upacara Adat"
    label_singular: "Upacara"
    folder: "content/budaya/upacara"
    create: true
    slug: "{{slug}}"
    summary: '{{nama}}'
    fields:
      - { label: "Nama Upacara", name: "nama", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Ringkasan", name: "ringkasan", widget: "text" }
      - { label: "Sejarah", name: "sejarah", widget: "markdown" }
      - { label: "Makna", name: "makna", widget: "markdown" }
      - { label: "Waktu Pelaksanaan", name: "waktu", widget: "string" }
      - label: "Tahapan"
        name: "tahapan"
        widget: "list"
        required: false
        fields:
          - { label: "Nama Tahapan", name: "nama", widget: "string" }
          - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - label: "Galeri"
        name: "galeri"
        widget: "list"
        required: false
        fields:
          - { label: "Gambar", name: "gambar", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Video YouTube URL", name: "video", widget: "string", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", default: 99 }

  - name: "kesenian"
    label: "🎵 Kesenian & Musik"
    label_singular: "Kesenian"
    folder: "content/budaya/kesenian"
    create: true
    slug: "{{slug}}"
    summary: '{{nama}} ({{kategori}})'
    fields:
      - { label: "Nama", name: "nama", widget: "string" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Alat Musik", "Tarian", "Lagu Daerah", "Seni Pertunjukan", "Lainnya"]
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Deskripsi", name: "body", widget: "markdown" }
      - { label: "Video YouTube URL", name: "video", widget: "string", required: false }
      - { label: "Audio URL", name: "audio", widget: "string", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", default: 99 }

  - name: "arsitektur"
    label: "🏠 Arsitektur & Rumah Adat"
    label_singular: "Arsitektur"
    folder: "content/budaya/arsitektur"
    create: true
    slug: "{{slug}}"
    summary: '{{nama}}'
    fields:
      - { label: "Nama Bangunan", name: "nama", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Deskripsi", name: "body", widget: "markdown" }
      - { label: "Filosofi Arsitektur", name: "filosofi", widget: "markdown", required: false }
      - label: "Galeri"
        name: "galeri"
        widget: "list"
        required: false
        fields:
          - { label: "Gambar", name: "gambar", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", default: 99 }

  - name: "pakaian"
    label: "👘 Pakaian & Atribut Adat"
    label_singular: "Pakaian"
    folder: "content/budaya/pakaian"
    create: true
    slug: "{{slug}}"
    summary: '{{nama}}'
    fields:
      - { label: "Nama Pakaian/Atribut", name: "nama", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Deskripsi", name: "body", widget: "markdown" }
      - { label: "Makna Simbol", name: "makna", widget: "markdown", required: false }
      - { label: "Penggunaan", name: "penggunaan", widget: "markdown", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", default: 99 }

  # ==========================================================
  # KATEGORI 6: PERTANIAN & KETAHANAN PANGAN
  # ==========================================================
  - name: "pertanian"
    label: "🌾 PERTANIAN & KETAHANAN PANGAN"
    label_singular: "Pertanian"
    files:
      - name: "filosofi_padi"
        label: "🌾 Filosofi Padi"
        file: "content/pertanian/filosofi-padi.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Filosofi Padi" }
          - { label: "Konten", name: "body", widget: "markdown" }

      - name: "leuit"
        label: "🏚️ Leuit / Sistem Lumbung"
        file: "content/pertanian/leuit.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Leuit — Sistem Lumbung Pangan" }
          - { label: "Fungsi Leuit", name: "fungsi", widget: "markdown" }
          - { label: "Sistem Penyimpanan", name: "penyimpanan", widget: "markdown" }
          - { label: "Pengelolaan Cadangan", name: "pengelolaan", widget: "markdown" }
          - { label: "Nilai Sosial", name: "nilai_sosial", widget: "markdown" }
          - label: "Dokumentasi"
            name: "dokumentasi"
            widget: "list"
            required: false
            fields:
              - { label: "Gambar", name: "gambar", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "kalender_tani"
    label: "📆 Kalender Tani / Pranata Mangsa"
    label_singular: "Periode Tani"
    folder: "content/pertanian/kalender"
    create: true
    slug: "{{slug}}"
    summary: '{{nama}} — {{rentang}}'
    fields:
      - { label: "Nama Periode", name: "nama", widget: "string" }
      - { label: "Rentang Waktu", name: "rentang", widget: "string" }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Gambar", name: "gambar", widget: "image", required: false }
      - label: "Aktivitas Pertanian"
        name: "aktivitas"
        widget: "list"
        required: false
        fields:
          - { label: "Nama Aktivitas", name: "nama", widget: "string" }
          - { label: "Deskripsi", name: "deskripsi", widget: "text", required: false }
      - { label: "Urutan", name: "urutan", widget: "number", default: 99 }

  # ==========================================================
  # KATEGORI 7: BERITA, AGENDA & PENGUMUMAN  # ==========================================================
  - name: "berita"
    label: "📰 Berita & Kabar Kasepuhan"
    label_singular: "Berita"
    folder: "content/berita"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: '{{judul}} — {{tanggal}}'
    sortable_fields: ['tanggal', 'judul']
    fields:
      - { label: "Judul", name: "judul", widget: "string" }
      - { label: "Tanggal", name: "tanggal", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Kabar Kasepuhan", "Budaya", "Pertanian", "Adat", "Pengumuman", "Wisata", "Riset", "Kerja Sama"]
        default: "Kabar Kasepuhan"
      - { label: "Penulis", name: "penulis", widget: "string", default: "Admin Kasepuhan" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Ringkasan", name: "ringkasan", widget: "text" }
      - { label: "Isi Berita", name: "body", widget: "markdown" }
      - { label: "Tag", name: "tags", widget: "list", required: false, default: [] }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["draft", "published"]
        default: "published"
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - { label: "Meta Title", name: "meta_title", widget: "string", required: false }
          - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
          - { label: "Keywords", name: "keywords", widget: "string", required: false }

  - name: "agenda"
    label: "📅 Agenda Kegiatan"
    label_singular: "Agenda"
    folder: "content/agenda"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: '{{nama}} — {{tanggal_mulai}}'
    fields:
      - { label: "Nama Kegiatan", name: "nama", widget: "string" }
      - { label: "Tanggal Mulai", name: "tanggal_mulai", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - { label: "Tanggal Selesai", name: "tanggal_selesai", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false, required: false }
      - { label: "Waktu", name: "waktu", widget: "string", required: false }
      - { label: "Lokasi", name: "lokasi", widget: "string" }
      - { label: "Penyelenggara", name: "penyelenggara", widget: "string", default: "Kasepuhan Adat Citorek" }
      - { label: "Deskripsi", name: "body", widget: "markdown" }
      - { label: "Foto", name: "foto", widget: "image", required: false }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Akan Datang", "Berlangsung", "Selesai", "Dibatalkan"]
        default: "Akan Datang"
      - { label: "Info Tambahan", name: "info_tambahan", widget: "text", required: false }

  - name: "pengumuman"
    label: "📢 Pengumuman Resmi"
    label_singular: "Pengumuman"
    folder: "content/pengumuman"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: '{{judul}} ({{prioritas}})'
    fields:
      - { label: "Judul", name: "judul", widget: "string" }
      - { label: "Tanggal", name: "tanggal", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - label: "Prioritas"
        name: "prioritas"
        widget: "select"
        options: ["Normal", "Penting", "Sangat Penting"]
        default: "Normal"
      - { label: "Isi", name: "body", widget: "markdown" }
      - { label: "Pin di Beranda", name: "pinned", widget: "boolean", default: false }
      - { label: "Berlaku Sampai", name: "berlaku_sampai", widget: "datetime", required: false, format: "YYYY-MM-DD", time_format: false }

  # ==========================================================
  # KATEGORI 8: GALERI, VIDEO & DOKUMEN
  # ==========================================================
  - name: "galeri"
    label: "🖼️ Galeri Foto"
    label_singular: "Album Galeri"
    folder: "content/galeri"
    create: true
    slug: "{{slug}}"
    summary: '{{judul}} ({{kategori}})'
    fields:
      - { label: "Judul Album", name: "judul", widget: "string" }
      - { label: "Tanggal", name: "tanggal", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Upacara Adat", "Kesenian", "Arsitektur", "Pertanian", "Alam", "Kegiatan", "Lainnya"]
      - { label: "Lokasi", name: "lokasi", widget: "string", required: false }
      - { label: "Fotografer", name: "fotografer", widget: "string", required: false }
      - { label: "Deskripsi", name: "deskripsi", widget: "text", required: false }
      - { label: "Cover Album", name: "cover", widget: "image", required: false }
      - label: "Foto-Foto"
        name: "foto"
        widget: "list"
        fields:
          - { label: "Gambar", name: "gambar", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "video"
    label: "🎬 Galeri Video"
    label_singular: "Video"
    folder: "content/video"
    create: true
    slug: "{{slug}}"
    summary: '{{judul}}'
    fields:
      - { label: "Judul Video", name: "judul", widget: "string" }
      - { label: "URL YouTube", name: "youtube_url", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Deskripsi", name: "deskripsi", widget: "text", required: false }
      - { label: "Tanggal", name: "tanggal", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD MMMM YYYY", time_format: false }

  - name: "dokumen"
    label: "📚 Dokumen & Publikasi"
    label_singular: "Dokumen"
    folder: "content/dokumen"
    create: true
    slug: "{{slug}}"
    summary: '{{judul}} — {{penulis}} ({{tahun}})'
    fields:
      - { label: "Judul", name: "judul", widget: "string" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["Artikel", "Jurnal", "Buku", "Regulasi", "Penelitian", "Dokumen Adat", "Publikasi", "Lainnya"]
      - { label: "Penulis", name: "penulis", widget: "string" }
      - { label: "Tahun", name: "tahun", widget: "string" }
      - { label: "Deskripsi", name: "deskripsi", widget: "text" }
      - { label: "Cover", name: "cover", widget: "image", required: false }
      - { label: "Upload PDF", name: "file_pdf", widget: "file", required: false }
      - label: "Akses"
        name: "akses"
        widget: "select"
        options:
          - { label: "Publik (baca & unduh)", value: "public" }
          - { label: "Hanya Baca", value: "readonly" }
          - { label: "Tertutup", value: "private" }
        default: "public"

  # ==========================================================
  # KATEGORI 9: WISATA BUDAYA
  # ==========================================================
  - name: "wisata"
    label: "🧭 WISATA BUDAYA"
    label_singular: "Wisata"
    files:
      - name: "panduan"
        label: "📋 Panduan Pengunjung"
        file: "content/wisata/panduan.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Panduan Pengunjung" }
          - { label: "Peringatan Wajib", name: "peringatan", widget: "text", default: "Pengunjung wajib menghormati aturan dan ketentuan adat yang berlaku di Kasepuhan Adat Citorek." }
          - { label: "Tatakrama", name: "tatakrama", widget: "markdown" }
          - { label: "Aturan Berpakaian", name: "pakaian", widget: "markdown" }
          - { label: "Larangan", name: "larangan", widget: "markdown" }
          - { label: "Etika Fotografi", name: "etika_foto", widget: "markdown" }
          - { label: "Etika Saat Upacara", name: "etika_upacara", widget: "markdown" }
          - { label: "Aturan Wilayah Tertentu", name: "aturan_wilayah", widget: "markdown" }

      - name: "rute"
        label: "🗺️ Lokasi & Rute"
        file: "content/wisata/rute.json"
        fields:
          - { label: "Judul", name: "judul", widget: "string", default: "Lokasi & Rute" }
          - { label: "Peta Embed URL", name: "peta_embed", widget: "string", required: false }
          - { label: "Deskripsi Rute", name: "body", widget: "markdown" }
          - label: "Titik Penting"
            name: "titik"
            widget: "list"
            required: false
            fields:
              - { label: "Nama", name: "nama", widget: "string" }
              - { label: "Deskripsi", name: "deskripsi", widget: "text" }
              - { label: "Latitude", name: "lat", widget: "string", required: false }
              - { label: "Longitude", name: "lng", widget: "string", required: false }

  - name: "paket_wisata"
    label: "🎒 Paket Wisata"
    label_singular: "Paket"
    folder: "content/wisata/paket"
    create: true
    slug: "{{slug}}"
    summary: '{{nama}} — {{durasi}}'
    fields:
      - { label: "Nama Paket", name: "nama", widget: "string" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Durasi", name: "durasi", widget: "string" }
      - { label: "Harga", name: "harga", widget: "string", required: false }
      - { label: "Deskripsi", name: "body", widget: "markdown" }
      - { label: "Fasilitas", name: "fasilitas", widget: "list", required: false }
      - { label: "Aktivitas", name: "aktivitas", widget: "list", required: false }
      - { label: "Pemandu", name: "pemandu", widget: "string", required: false }
      - { label: "Homestay", name: "homestay", widget: "string", required: false }
      - label: "Galeri"
        name: "galeri"
        widget: "list"
        required: false
        fields:
          - { label: "Gambar", name: "gambar", widget: "image" }

  # ==========================================================
  # KATEGORI 10: PESAN MASUK
  # ==========================================================
  - name: "pesan"
    label: "💬 Pesan Masuk dari Pengunjung"
    label_singular: "Pesan"
    folder: "content/pesan"
    create: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: '{{nama}} — {{keperluan}}'
    fields:
      - { label: "Nama Pengirim", name: "nama", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "No. WhatsApp/Telepon", name: "telepon", widget: "string" }
      - label: "Keperluan"
        name: "keperluan"
        widget: "select"
        options: ["Kerja sama", "Penelitian", "Kunjungan", "Media", "Wisata budaya", "Pertanyaan umum"]
      - { label: "Pesan", name: "pesan", widget: "text" }
      - { label: "Tanggal Masuk", name: "tanggal", widget: "datetime" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["Baru", "Sudah Dibaca", "Sudah Dibalas", "Diarsipkan"]
        default: "Baru"
      - { label: "Catatan Admin", name: "catatan", widget: "text", required: false }
